version: '3.8'

services:
  # MongoDB service
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=reward_game_db
    networks:
      - app-network
    restart: always

  # Backend service - uncomment sau khi build xong
  # backend:
  #   build:
  #     context: ./backend/reward-game
  #     dockerfile: Dockerfile
  #   container_name: spring-backend
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - mongodb
  #   environment:
  #     - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/reward_game_db
  #   networks:
  #     - app-network

  # Frontend service - uncomment sau khi build xong
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: react-frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data: